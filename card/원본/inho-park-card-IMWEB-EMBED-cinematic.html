  아임웹 코드 위젯용 스니펫 (다크 시네마틱형)
  디자인모드 > 위젯추가(+) > 코드 위젯 > 코드 위젯 설정 > 이 파일 전체를 그대로 붙여넣기

<div class="ip-card">
  <style>
    .ip-card{
      --bg:#151310;
      --ink:#F4EFE4;
      --ink-soft:#B9B2A2;
      --line:#3A362E;
      --muted:#7A7468;
      --accent:#D8493A;
      position:relative;
      display:flex;
      justify-content:center;
      background:var(--bg);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      padding:48px 18px 64px;
      overflow:hidden;
      box-sizing:border-box;
    }
    .ip-card *{ box-sizing:border-box; }
    .ip-card ul{ list-style:none; margin:0; padding:0; }

    .ip-card .vignette{
      position:absolute; inset:0; pointer-events:none; z-index:0;
      background:radial-gradient(circle at 50% 35%, transparent 35%, rgba(0,0,0,.55) 100%);
    }
    .ip-card .scanlines{
      position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.25;
      background:repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0px, rgba(255,255,255,.04) 1px, transparent 1px, transparent 3px);
    }
    .ip-card .glow{
      position:absolute; left:50%; top:120px; width:360px; height:360px;
      transform:translateX(-50%);
      background:radial-gradient(circle, rgba(216,73,58,.28) 0%, rgba(216,73,58,0) 70%);
      filter:blur(10px); z-index:0;
    }

    .ip-card .card{ position:relative; z-index:1; width:100%; max-width:420px; }
    .ip-card .card > *{ opacity:0; animation:ipFadeUp .6s ease forwards; }
    .ip-card .card > *:nth-child(1){animation-delay:.02s}
    .ip-card .card > *:nth-child(2){animation-delay:.10s}
    .ip-card .card > *:nth-child(3){animation-delay:.20s}
    .ip-card .card > *:nth-child(4){animation-delay:.28s}
    .ip-card .card > *:nth-child(5){animation-delay:.36s}
    .ip-card .card > *:nth-child(6){animation-delay:.44s}
    .ip-card .card > *:nth-child(7){animation-delay:.52s}
    @keyframes ipFadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

    .ip-card .top-row{
      display:flex; justify-content:space-between; align-items:center;
      font-size:11px; letter-spacing:.14em; font-weight:700;
      color:var(--ink-soft); margin-bottom:40px;
    }
    .ip-card .rec{ display:flex; align-items:center; gap:7px; font-family:"SF Mono",Menlo,Consolas,monospace; }
    .ip-card .rec .dot{
      width:7px; height:7px; border-radius:50%; background:var(--accent);
      box-shadow:0 0 6px var(--accent); animation:ipPulse 1.6s ease-in-out infinite;
    }
    @keyframes ipPulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
    .ip-card .mini-mark{ font-weight:900; font-size:14px; transform:skewX(-8deg); display:inline-block; color:var(--ink); }

    .ip-card .hero{ text-align:center; margin-bottom:8px; }
    .ip-card .name-ko{
      display:block; font-size:12px; font-weight:700; letter-spacing:.3em;
      color:var(--muted); margin-bottom:12px;
    }
    .ip-card .name-en{ font-size:46px; font-weight:900; line-height:1; letter-spacing:-.01em; color:var(--ink); }
    .ip-card .role{
      margin-top:12px; font-size:12px; font-weight:700; letter-spacing:.25em;
      color:var(--accent); text-transform:uppercase;
    }

    .ip-card .sprocket{ width:100%; height:11px; display:block; color:rgba(216,73,58,.35); margin:26px 0; }

    .ip-card .contact-list{ display:flex; flex-direction:column; gap:11px; margin-bottom:26px; }
    .ip-card .contact-list a{
      display:flex; align-items:center; gap:10px;
      color:var(--ink); text-decoration:none; font-size:15px; font-weight:600;
    }
    .ip-card .contact-list svg{ flex:none; opacity:.8; color:var(--ink-soft); }

    .ip-card .actions{ display:flex; flex-direction:column; gap:10px; margin-bottom:30px; }
    .ip-card .btn{
      display:flex; align-items:center; justify-content:center; gap:8px;
      width:100%; padding:15px 18px; border-radius:2px;
      font-size:14px; font-weight:800; letter-spacing:.02em;
      text-decoration:none; cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:opacity .15s ease, transform .15s ease;
    }
    .ip-card .btn:active{ opacity:.75; transform:scale(.97); }
    .ip-card .btn-primary{ background:var(--accent); color:#151310; border:1.5px solid var(--accent); }
    .ip-card .btn-secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }

    .ip-card .tagline{ font-size:12px; color:var(--ink-soft); letter-spacing:.08em; text-align:center; }
    .ip-card .footer{ text-align:center; margin-top:6px; }
    .ip-card .site{ font-size:17px; font-weight:800; letter-spacing:.04em; color:var(--ink); }
    .ip-card .studio-tag{
      font-size:11px; color:var(--muted); letter-spacing:.14em; font-weight:700;
      margin-top:10px; font-family:"SF Mono",Menlo,Consolas,monospace;
    }

    .ip-card .toast{
      position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(12px);
      background:var(--accent); color:#151310;
      font-size:13px; font-weight:800; padding:11px 18px; border-radius:2px;
      opacity:0; pointer-events:none;
      transition:opacity .2s ease, transform .2s ease; white-space:nowrap; z-index:999;
    }
    .ip-card .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  </style>

  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="card">
    <div class="glow"></div>

    <div class="top-row">
      <span class="rec"><span class="dot"></span>REC</span>
      <span class="mini-mark">IN</span>
    </div>

    <div class="hero">
      <span class="name-ko">박인호</span>
      <div class="name-en">INHO<br>PARK</div>
      <div class="role">대표 포토그래퍼</div>
    </div>

    <svg class="sprocket" viewBox="0 0 400 11" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="ipSprocketB" width="18" height="11" patternUnits="userSpaceOnUse">
          <rect x="0" y="1" width="10" height="9" rx="2" fill="currentColor"/>
        </pattern>
      </defs>
      <rect width="400" height="11" fill="url(#ipSprocketB)"/>
    </svg>

    <ul class="contact-list">
      <li>
        <a href="mailto:photoinnho@gmail.com">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 6l8 7 8-7"/></svg>
          photoinnho@gmail.com
        </a>
      </li>
      <li>
        <a href="tel:+821024972859">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/></svg>
          010-2497-2859
        </a>
      </li>
    </ul>

    <div class="actions">
      <button class="btn btn-primary" id="ipSaveContactBtn2" type="button">연락처 저장</button>
      <a class="btn btn-secondary" href="https://www.instudio.kr" target="_blank" rel="noopener">웹사이트 방문</a>
    </div>

    <div class="tagline">A STUDIO FOR COMMERCIAL STORYTELLING</div>
    <div class="footer">
      <div class="site">WWW.INSTUDIO.KR</div>
      <div class="studio-tag">INSTUDIO · 아이엔스튜디오</div>
    </div>
  </div>

  <div class="toast" id="ipToast2">연락처가 저장되었습니다</div>
</div>

<script>
(function(){
  function buildVCard(){
    return [
      "BEGIN:VCARD","VERSION:3.0",
      "N:박인호;;;;",
      "FN:박인호 (Inho Park)",
      "ORG:INSTUDIO 아이엔스튜디오",
      "TITLE:대표 포토그래퍼",
      "TEL;TYPE=CELL,VOICE:010-2497-2859",
      "EMAIL;TYPE=INTERNET:photoinnho@gmail.com",
      "URL:https://www.instudio.kr",
      "NOTE:A studio for commercial storytelling — Photo / Film / Branding",
      "END:VCARD"
    ].join("\r\n");
  }
  var btn = document.getElementById('ipSaveContactBtn2');
  if(btn){
    btn.addEventListener('click', function(){
      var blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = "InhoPark-INSTUDIO.vcf";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      var toast = document.getElementById('ipToast2');
      toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); }, 2200);
    });
  }
})();
</script>
