<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1200px; height:630px; overflow:hidden;}
  body{
    background:#ECE8DE;
    color:#242019;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    position:relative;
    width:1200px;
    height:630px;
  }
  .topbar{
    position:absolute; top:56px; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:16px; font-weight:700; letter-spacing:.14em; color:#4A453C;
  }
  .content{
    position:absolute; top:0; left:0; width:1200px; height:630px;
    display:flex; align-items:center; justify-content:center; gap:70px;
  }
  .badge{ width:220px; height:220px; color:#242019; flex:none; }
  .textblock{ text-align:left; }
  .name-ko{ font-size:20px; font-weight:800; color:#242019; margin-bottom:2px; }
  .role{ font-size:18px; color:#4A453C; margin-bottom:18px; }
  .name-en{ font-size:96px; font-weight:900; line-height:.98; letter-spacing:-.01em; margin-bottom:26px; }
  .tags{ font-size:16px; font-weight:700; letter-spacing:.18em; color:#8B8577; }
  .footer{
    position:absolute; bottom:52px; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:17px; font-weight:800; letter-spacing:.04em; color:#242019;
  }
  .footer .tagline{ font-size:14px; font-weight:600; color:#4A453C; letter-spacing:.04em; }
  .sprocket{ position:absolute; bottom:100px; left:70px; right:70px; height:10px; color:#C9C3B4; }
</style>
</head>
<body>

  <div class="topbar">
    <span>PHOTO / FILM / BRANDING</span>
    <span>INSTUDIO · 아이엔스튜디오</span>
  </div>

  <div class="content">
    <svg class="badge" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect x="-90" y="-90" width="180" height="180" rx="16" fill="none" stroke="currentColor" stroke-width="4"/>
      <path d="M -100,-80 L -100,-100 L -80,-100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
      <path d="M 100,-80 L 100,-100 L 80,-100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
      <path d="M -100,80 L -100,100 L -80,100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
      <path d="M 100,80 L 100,100 L 80,100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
      <g transform="skewX(-8)">
        <text x="0" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="currentColor">IN</text>
      </g>
    </svg>
    <div class="textblock">
      <div class="name-ko">박인호 <span class="role" style="display:inline; font-size:18px; font-weight:600;">대표 포토그래퍼</span></div>
      <div class="name-en">INHO PARK</div>
      <div class="tags">A STUDIO FOR COMMERCIAL STORYTELLING</div>
    </div>
  </div>

  <svg class="sprocket" viewBox="0 0 1060 10" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="sp" width="20" height="10" patternUnits="userSpaceOnUse">
        <rect x="0" y="1" width="11" height="8" rx="2" fill="currentColor"/>
      </pattern>
    </defs>
    <rect width="1060" height="10" fill="url(#sp)"/>
  </svg>

  <div class="footer">
    <span class="tagline">Digital Business Card</span>
    <span>WWW.INSTUDIO.KR</span>
  </div>

</body>
</html>
