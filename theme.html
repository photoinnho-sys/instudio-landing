:root{
  /* 랜딩과 같은 색수차 팔레트 */
  --is-mg:#FF2E93; --is-cy:#00E5FF; --is-bl:#6C4CFF;
  --is-bg:#06060C; --is-bone:#F4EFFA;
  --is-line:rgba(244,239,250,.11);
}

/* ── 바탕 ─────────────────────────────────────────────────────── */
html,body.doz_sys{background:var(--is-bg)!important}
body.doz_sys,body.doz_sys .inside,body.doz_sys .section_wrap{
  color:rgba(244,239,250,.88)!important}
/* 검정으로 칠해둔 섹션을 우리 바탕색으로 */
.section_bg_color[style*="rgb(0, 0, 0)"],
.section_bg_color[style*="#000"],
.section_wrap[style*="rgb(0, 0, 0)"]{background-color:var(--is-bg)!important}

/* ── 서체 ─────────────────────────────────────────────────────── */
body.doz_sys,body.doz_sys p,body.doz_sys span,body.doz_sys div,body.doz_sys li,
body.doz_sys td,body.doz_sys input,body.doz_sys textarea,body.doz_sys select,
body.doz_sys button{font-family:'PreKR',-apple-system,sans-serif!important;
  letter-spacing:-.012em}
body.doz_sys h1,body.doz_sys h2,body.doz_sys h3,body.doz_sys h4,
._fixed_header_section a{font-family:'Anton','PreKR',sans-serif!important;
  letter-spacing:-.03em;font-weight:400!important}

/* ── 헤더 : 랜딩과 동일하게 투명 + 상단 스크림 ──────────────────── */
._fixed_header_section,
._fixed_header_section .inline-section-wrap,
._fixed_header_section .section_inner,
._fixed_header_section .inside,
._fixed_header_section .doz_row,
._fixed_header_section .col-dz,
._fixed_header_section ._widget_data,
._fixed_header_section .section_bg_color,
.section_bg_color.fixed_transform,
.fixed_transform .section_bg_color,
._fixed_header_section > div{background:transparent!important;background-color:transparent!important}
._fixed_header_section::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,6,12,.78) 0%,rgba(6,6,12,.34) 62%,rgba(6,6,12,0) 100%)}
._fixed_header_section a{text-transform:uppercase;font-size:15px!important;
  text-shadow:0 1px 14px rgba(0,0,0,.65);transition:color .16s cubic-bezier(0,0,.2,1)}
._fixed_header_section a:hover{color:var(--is-cy)!important}

/* ── 푸터 : 흰 배경 제거 ───────────────────────────────────────── */
.footer-section,.footer-section .section_bg_color{background:var(--is-bg)!important}
.footer-section,.footer-section *{color:rgba(244,239,250,.42)!important;
  border-color:var(--is-line)!important}

/* ── 갤러리 : 작품이 주인공이므로 색은 건드리지 않는다 ──────────── */
._gallery_wrap img,.gallery-widget img{border-radius:4px;
  transition:transform .7s cubic-bezier(.16,1,.3,1),filter .35s cubic-bezier(0,0,.2,1)}
._gallery_wrap a:hover img,.gallery-widget a:hover img{transform:scale(1.03)}

/* ── Contact 블록 : 어두운 회색 글자가 검정 위에서 안 읽혔다 ────── */
body.doz_sys p{color:rgba(244,239,250,.72)!important}
body.doz_sys a{color:inherit}

/* ── 버튼 ─────────────────────────────────────────────────────────
   아임웹은 카테고리 내비와 폼 전송 버튼에 같은 클래스(.btn-primary)를 쓴다.
   전부 그라디언트로 칠하면 화면에 채운 막대가 여섯 개 생긴다.
   기본은 조용한 알약, 전송 버튼만 강조 — 순서로 특이도를 넘긴다. */
.btn.btn-primary{
  background:transparent!important;color:rgba(244,239,250,.66)!important;
  box-shadow:inset 0 0 0 1px var(--is-line)!important;border:0!important;
  border-radius:999px!important;padding:0 20px!important;
  font-family:'JBM',ui-monospace,monospace!important;font-size:11px!important;
  letter-spacing:.13em!important;text-transform:uppercase;font-weight:400!important;
  transition:color .16s cubic-bezier(0,0,.2,1),background .16s cubic-bezier(0,0,.2,1),
             box-shadow .16s cubic-bezier(0,0,.2,1)}
.btn.btn-primary:hover{color:#06060C!important;background:var(--is-cy)!important;
  box-shadow:0 6px 22px -8px rgba(0,229,255,.7)!important}

._form-widget .btn-primary,._form-widget .btn,
._form-widget [type=submit],._form-widget button{
  background:linear-gradient(96deg,#FFC97A 0%,var(--is-mg) 46%,var(--is-bl) 100%)!important;
  color:#160B04!important;border:0!important;border-radius:4px!important;
  font-family:'PreKR',sans-serif!important;font-size:14px!important;
  letter-spacing:-.01em!important;text-transform:none!important;
  font-weight:700!important;box-shadow:0 10px 34px -12px rgba(108,76,255,.7)!important}

/* ── 문의 폼 : 랜딩 안의 폼과 같은 모양 ───────────────────────── */
._form-widget input:not([type=checkbox]):not([type=radio]):not([type=submit]):not([type=button]),
._form-widget textarea,._form-widget select{
  background:rgba(244,239,250,.05)!important;color:var(--is-bone)!important;
  border:0!important;box-shadow:inset 0 0 0 1px var(--is-line)!important;
  border-radius:4px!important;min-height:44px!important;padding:0 14px!important}
._form-widget textarea{min-height:92px!important;padding:12px 14px!important}
._form-widget input:focus,._form-widget textarea:focus,._form-widget select:focus{
  box-shadow:inset 0 0 0 1px rgba(244,239,250,.8)!important;outline:0!important}
._form-widget .control-label{margin-bottom:8px!important;display:block;font-size:12.5px!important}

/* ── 페이지 안의 문의 폼 배치 ───────────────────────────────────
   기본은 한 줄에 한 칸씩 쌓여 필드가 1264px 로 늘어진다. 두 열로 접고
   가운데로 모은다. 랜딩 안(.is)의 폼은 이미 자기 규칙이 있으므로 제외. */
._form-widget form{max-width:860px;margin-inline:auto;
  display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;align-items:start}
._form-widget form > *{margin:0!important}
/* form 바로 아래에 클래스 없는 빈 div 가 있어 격자 한 칸을 먹는다.
   그대로 두면 첫 칸(회사명)이 오른쪽 열에서 시작한다. */
._form-widget form > div:not(.form-group){display:none!important}
/* 두 칸을 다 쓰는 것만 지정해 빈 칸이 남지 않게 짝을 맞춘다:
   회사명|담당자명 · 연락처|이메일 · 촬영종류 · 시기|장소 · 예산 · 문의내용 */
._form-widget form .form-group:has(.checkbox),
._form-widget form .form-group:has(textarea),
._form-widget form .form-group:has(.form-select-wrap){grid-column:1/-1}
._form-widget form .form-group:has(.checkbox) .checkbox{
  display:inline-flex!important;width:auto!important;margin:0 20px 6px 0!important}
._form-widget .form.text-center{max-width:860px;margin:20px auto 0}
._form-widget .btn-primary{display:block;width:100%;
  padding:15px 0!important;line-height:1!important;height:auto!important}
/* 랜딩 안의 폼은 자기 규칙을 쓴다 */
.is ._form-widget form{max-width:none!important;margin:0!important}
.is ._form-widget .form.text-center{max-width:none!important;margin:18px 0 0!important}

/* ── 선택 영역 ────────────────────────────────────────────────── */
::selection{background:var(--is-mg);color:#0A0A0A}
</style>

<script>
/* ══ 메인 이전 대비 링크 보정 ═══════════════════════════════════════
   실측(/38)에서 두 가지가 걸렸다. 홈이 바뀌면 둘 다 사람을 엉뚱한 데로
   보낸다. 메뉴 설정을 일일이 고치는 대신 여기서 한 번에 잡는다. */
(function () {
  function fix() {
    /* 1) 모바일 메뉴의 로고가 /1 을 가리킨다. /1 은 옛 메인의 번호 별칭이라
          홈이 바뀌어도 계속 옛 페이지로 데려간다. */
    document.querySelectorAll('a[href="/1"], a[href="/1/"]').forEach(function (a) {
      a.setAttribute('href', '/');
    });

    /* 2) 헤더의 Contact 는 홈의 특정 섹션 앵커(#s2025…)를 가리킨다. 그 앵커는
          옛 메인에만 있으므로 새 홈에서는 아무 데도 못 간다. 지금 페이지에
          문의 폼이 있으면 그리로 부드럽게 내려보내고, 없으면 원래대로 둔다. */
    document.querySelectorAll('a[href*="#s2025"]').forEach(function (a) {
      if (a.dataset.isFix) return;
      a.dataset.isFix = '1';
      a.addEventListener('click', function (ev) {
        var t = null, all = document.querySelectorAll('._form-widget');
        for (var i = 0; i < all.length; i++) {
          if (all[i].getBoundingClientRect().height > 120) { t = all[i]; break; }
        }
        if (!t) return;                       // 폼이 없는 페이지 → 원래 링크대로
        ev.preventDefault();
        var y = t.getBoundingClientRect().top + scrollY - 90;
        if (window.lenis && window.lenis.scrollTo) window.lenis.scrollTo(y, { duration: 1.2 });
        else scrollTo({ top: y, behavior: 'smooth' });
      });
    });
  }
  fix();
  // 아임웹이 헤더를 늦게 그리는 경우가 있어 몇 번 더 확인한다
  var n = 0, t = setInterval(function () { fix(); if (++n > 6) clearInterval(t); }, 600);
})();
</script>
